name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest==8.3.3
      - run: python -m pytest tests backends -q -p no:cacheprovider
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No videos, no files over 2 MB
        run: python3 scripts/check_large_files.py --max-mb 2
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          missing=$(git log --format='%H %s%n%b%n--END--' origin/${{ github.base_ref }}..HEAD | awk '/^[0-9a-f]{40} /{c=$1; ok=0} /^Signed-off-by: /{ok=1} /^--END--$/{if(!ok) print c}')
          if [ -n "$missing" ]; then echo "Commits without Signed-off-by: $missing"; exit 1; fi
