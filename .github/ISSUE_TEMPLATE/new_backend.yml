name: New PLC software
description: Propose or volunteer a backend
labels: [backend]
body:
  - type: input
    id: software
    attributes:
      label: Vendor software and version
      placeholder: Delta ISPSoft 3.19
    validations:
      required: true
  - type: textarea
    id: path
    attributes:
      label: Write path
      description: Official API, import format (PLCopen XML, CSV, text), or file format? Link public documentation.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: How to compile and read back
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: The approach does not break the vendor's licence terms
          required: true
        - label: I can run it on a licensed installation
